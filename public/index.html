<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeEzee AI — Powered by Nexpla</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F3F4F6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
#header { background: #0B6C6C; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.brand-name { color: #fff; font-weight: 700; font-size: 15px; }
.brand-sub { color: rgba(255,255,255,0.7); font-size: 11px; }
.db-tag { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: #fff; }

/* Messages */
#messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; }
.row.user { justify-content: flex-end; }
.row.bot { align-items: flex-start; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #0B6C6C; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
.bubble { max-width: 620px; border-radius: 18px; font-size: 14px; line-height: 1.5; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.bubble.user { background: #0B6C6C; color: #fff; padding: 10px 16px; border-radius: 18px 18px 4px 18px; }
.bubble.bot { background: #fff; color: #111; padding: 14px 16px; border-radius: 4px 18px 18px 18px; }

/* Suggestions */
#suggestions { padding: 0 24px 12px; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
.chip { background: #fff; color: #0B6C6C; border: 1px solid rgba(11,108,108,0.3); border-radius: 20px; padding: 6px 14px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.chip:hover { background: #0B6C6C; color: #fff; }

/* Input bar */
#input-bar { padding: 12px 24px 20px; background: #fff; border-top: 1px solid #E5E7EB; display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
#inp { flex: 1; border: 1.5px solid #E5E7EB; border-radius: 24px; padding: 10px 18px; font-size: 14px; outline: none; font-family: inherit; }
#inp:focus { border-color: #0B6C6C; }
#sendbtn { width: 42px; height: 42px; border-radius: 50%; background: #0B6C6C; border: none; cursor: pointer; color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#sendbtn:disabled { background: #D1D5DB; cursor: default; }
#micbtn { width: 42px; height: 42px; border-radius: 50%; background: #fff; border: 2px solid #0B6C6C; cursor: pointer; color: #0B6C6C; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
#micbtn:hover { background: #0B6C6C; color: #fff; }

/* Typing dots */
.dots { display: flex; gap: 5px; padding: 4px 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #0B6C6C; animation: bop 1s infinite; }
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Cards */
.stats-row { display: grid; gap: 10px; margin-bottom: 12px; }
.stat { background: #F9FAFB; border: 1px solid #E5E7EB; border-radius: 10px; padding: 12px 14px; }
.stat.green { background: #F0FDF4; border-color: #BBF7D0; }
.stat.red { background: #FEF2F2; border-color: #FECACA; }
.stat.yellow { background: #FEFCE8; border-color: #FEF08A; }
.slbl { font-size: 11px; color: #9CA3AF; margin-bottom: 3px; }
.stat.green .slbl{color:#16A34A}.stat.red .slbl{color:#DC2626}.stat.yellow .slbl{color:#D97706}
.sval { font-size: 20px; font-weight: 700; color: #111827; }
.stat.green .sval{color:#16A34A}.stat.red .sval{color:#DC2626}.stat.yellow .sval{color:#D97706}
.tbl { border: 1px solid #E5E7EB; border-radius: 10px; overflow: hidden; margin: 10px 0; background: #fff; width: 100%; }
.thd { background: #F9FAFB; border-bottom: 1px solid #E5E7EB; display: flex; }
.thd span { padding: 8px 12px; font-size: 11px; font-weight: 600; color: #6B7280; flex: 1; }
.trow { display: flex; border-bottom: 1px solid #F9FAFB; }
.trow:last-child { border: none; }
.trow span { padding: 10px 12px; font-size: 13px; flex: 1; color: #111827; }
.acts { display: flex; gap: 8px; margin-top: 10px; }
.bp { background: #0B6C6C; color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; }
.bo { background: #fff; color: #0B6C6C; border: 1px solid #0B6C6C; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; }
.msg { font-size: 14px; color: #374151; line-height: 1.6; margin-bottom: 12px; }
.inv-box { border: 2px solid #0B6C6C; border-radius: 12px; overflow: hidden; margin: 10px 0; }
.inv-head { background: #0B6C6C; padding: 12px 16px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
.inv-body { padding: 14px 16px; }
.inv-line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #F3F4F6; font-size: 13px; }
.inv-total { display: flex; justify-content: space-between; padding: 10px 0 0; font-size: 15px; font-weight: 700; border-top: 1px solid #E5E7EB; margin-top: 4px; }

/* ===== VOICE MODAL ===== */
#voice-modal { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; }
#voice-modal.active { display: flex; }
#voice-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); cursor: pointer; }
#voice-card { position: relative; background: #fff; border-radius: 24px; padding: 48px 56px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-shadow: 0 24px 64px rgba(0,0,0,0.2); min-width: 380px; z-index: 1; }

/* Orb */
#orb-wrap { position: relative; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center; }
.ring { position: absolute; border-radius: 50%; border: 2px solid #0B6C6C; opacity: 0; }
.ring1 { width: 140px; height: 140px; }
.ring2 { width: 110px; height: 110px; }
.ring3 { width: 80px; height: 80px; }
#orb-core { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #0B6C6C, #14A0A0); display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 0 24px rgba(11,108,108,0.4); z-index: 2; }

/* Listening state */
#voice-modal.listening .ring { animation: ripple 2s ease-out infinite; }
#voice-modal.listening .ring2 { animation-delay: 0.5s; }
#voice-modal.listening .ring3 { animation-delay: 1s; }
#voice-modal.listening #orb-core { animation: orbpulse 1.5s ease-in-out infinite; }
@keyframes ripple { 0%{transform:scale(0.8);opacity:0.6} 100%{transform:scale(1.4);opacity:0} }
@keyframes orbpulse { 0%,100%{box-shadow:0 0 24px rgba(11,108,108,0.4)} 50%{box-shadow:0 0 40px rgba(11,108,108,0.8)} }

/* Waveform bars */
#waveform { display: flex; gap: 4px; align-items: center; height: 36px; }
.bar { width: 4px; border-radius: 2px; background: #0B6C6C; opacity: 0.3; transition: height 0.1s; }
#voice-modal.listening .bar { opacity: 1; animation: wave 1s ease-in-out infinite; }
.bar:nth-child(1){animation-delay:0s}.bar:nth-child(2){animation-delay:.1s}.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}.bar:nth-child(5){animation-delay:.4s}.bar:nth-child(6){animation-delay:.3s}
.bar:nth-child(7){animation-delay:.2s}.bar:nth-child(8){animation-delay:.1s}.bar:nth-child(9){animation-delay:0s}
@keyframes wave {
  0%,100% { height: 6px; }
  50% { height: 28px; }
}

/* Status text */
#voice-status { font-size: 20px; font-weight: 600; color: #111827; }
#voice-sub { font-size: 14px; color: #9CA3AF; }
#voice-type-link { font-size: 13px; color: #0B6C6C; cursor: pointer; text-decoration: underline; margin-top: 4px; }
#voice-cancel { background: none; border: 1px solid #E5E7EB; border-radius: 20px; padding: 6px 20px; font-size: 13px; color: #6B7280; cursor: pointer; font-family: inherit; }
#voice-cancel:hover { border-color: #DC2626; color: #DC2626; }

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:3px}
</style>
</head>
<body>

<!-- Voice Modal -->
<div id="voice-modal">
<div id="voice-error" style="display:none;color:#DC2626;font-size:12px;margin:8px 0;text-align:center"></div>
  <div id="voice-backdrop"></div>
  <div id="voice-card">
    <div id="orb-wrap">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div id="orb-core">&#127908;</div>
    </div>
    <div id="waveform">
      <div class="bar" style="height:8px"></div>
      <div class="bar" style="height:14px"></div>
      <div class="bar" style="height:20px"></div>
      <div class="bar" style="height:28px"></div>
      <div class="bar" style="height:22px"></div>
      <div class="bar" style="height:28px"></div>
      <div class="bar" style="height:20px"></div>
      <div class="bar" style="height:14px"></div>
      <div class="bar" style="height:8px"></div>
    </div>
    <div id="voice-status">Listening...</div>
    <div id="voice-sub">Speak in Hindi or English</div>
    <button id="voice-stop" style="background:#0B6C6C;color:#fff;border:none;border-radius:20px;padding:8px 28px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:500;">Stop &amp; Send</button>
    <button id="voice-cancel">Cancel</button>
    <div id="voice-type-link">Type instead</div>
  </div>
</div>

<!-- Header -->
<div id="header">
  <div class="brand">
    <div class="logo">&#128138;</div>
    <div>
      <div class="brand-name">TradeEzee AI</div>
      <div class="brand-sub">Powered by Nexpla</div>
    </div>
  </div>
  <div class="db-tag">ME2627 &middot; FY 2026-27</div>
</div>

<div id="messages"></div>
<div id="suggestions"></div>

<div id="input-bar">
  <button id="micbtn" title="Click to speak">&#127908;</button>
  <input id="inp" type="text" placeholder="Ask anything or click mic to speak..." />
  <button id="sendbtn">&#10148;</button>
</div>

<script>
var chatHistory = [];
var busy = false;
var mediaRecorder = null;
var audioChunks = [];
var silenceTimer = null;
var voiceModal = document.getElementById('voice-modal');

function fmt(n) {
  n = Number(n)||0;
  if(n>=10000000) return '\u20B9'+(n/10000000).toFixed(2)+'Cr';
  if(n>=100000) return '\u20B9'+(n/100000).toFixed(2)+'L';
  if(n>=1000) return '\u20B9'+(n/1000).toFixed(1)+'K';
  return '\u20B9'+n.toFixed(0);
}

function addBot(html) {
  var d = document.createElement('div');
  d.className = 'row bot';
  d.innerHTML = '<div class="avatar">\uD83E\uDD16</div><div class="bubble bot">'+html+'</div>';
  document.getElementById('messages').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function addUser(text) {
  var d = document.createElement('div');
  d.className = 'row user';
  d.innerHTML = '<div class="bubble user">'+text+'</div>';
  document.getElementById('messages').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function showTyping() {
  var d = document.createElement('div');
  d.className = 'row bot'; d.id = 'typing';
  d.innerHTML = '<div class="avatar">\uD83E\uDD16</div><div class="bubble bot"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  document.getElementById('messages').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function hideTyping() { var el=document.getElementById('typing'); if(el) el.remove(); }

// ---- TTS / Audio ----
var audioCtx = null;

function unlockAudio() {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') return audioCtx.resume();
  } catch(e) { console.warn('AudioContext unlock failed:', e); }
  return Promise.resolve();
}

function base64ToBlob(base64, mime) {
  var binary = atob(base64);
  var bytes = new Uint8Array(binary.length);
  for(var i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type:mime || 'audio/wav'});
}

function playSarvamAudio(base64) {
  if(!base64) return Promise.reject(new Error('Sarvam returned no audio'));

  return unlockAudio().then(function() {
    var blob = base64ToBlob(base64, 'audio/wav');
    var url = URL.createObjectURL(blob);

    return new Promise(function(resolve, reject) {
      var audio = new Audio();
      audio.preload = 'auto';
      audio.onended = function(){ URL.revokeObjectURL(url); resolve(); };
      audio.onerror = function(){
        URL.revokeObjectURL(url);
        reject(new Error('Browser could not decode Sarvam WAV audio'));
      };
      audio.src = url;
      audio.play().catch(function(err){
        URL.revokeObjectURL(url);
        reject(err);
      });
    });
  });
}

function sarvamError(data, status) {
  if(data && typeof data.error === 'string') return data.error;
  if(data && data.error && data.error.message) return data.error.message;
  return 'TTS failed (HTTP ' + status + ')';
}

function speakMessage(text) {
  if(!text) return;

  fetch('/api/tts', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:text})
  }).then(function(r){
    return r.json().then(function(d){
      if(!r.ok) throw new Error(sarvamError(d, r.status));
      return d;
    });
  }).then(function(d){
    return playSarvamAudio(d.audio);
  }).catch(function(err){
    console.error('[Sarvam TTS]', err);
    var voiceErr = document.getElementById('voice-error');
    if(voiceErr) { voiceErr.textContent = 'Voice unavailable: ' + err.message; voiceErr.style.display = 'block'; }
  });
}

// ---- Render ----
function render(p) {
  var html = '';
  if(p.message) html += '<div class="msg">'+p.message+'</div>';
  if(p.invoice) {
    var inv = p.invoice;
    var lines = (inv.lines||[]).map(function(l){ return '<div class="inv-line"><span><b>'+l.desc+'</b> <span style="color:#9CA3AF">&times;'+l.qty+' @ \u20B9'+l.rate+'</span></span><span style="font-weight:600">'+fmt(l.amount)+'</span></div>'; }).join('');
    html += '<div class="inv-box"><div class="inv-head"><div><div style="font-size:16px;font-weight:700">Invoice #'+inv.no+'</div><div style="font-size:12px;opacity:0.8">'+inv.party+' &middot; '+inv.area+'</div></div><span style="background:rgba(255,255,255,0.2);color:#fff;padding:2px 10px;border-radius:20px;font-size:12px">\u2713 Confirmed</span></div><div class="inv-body">'+lines+'<div class="inv-line" style="border:none;color:#6B7280"><span>Subtotal</span><span>'+fmt(inv.subtotal)+'</span></div><div class="inv-line" style="border:none;color:#6B7280"><span>GST</span><span>'+fmt(inv.gst)+'</span></div><div class="inv-total"><span>Net Total</span><span style="color:#0B6C6C">'+fmt(inv.total)+'</span></div></div></div>';
  }
  if(p.stats && p.stats.length > 0) {
    var cols = Math.min(p.stats.length,4);
    html += '<div class="stats-row" style="grid-template-columns:repeat('+cols+',1fr)">';
    p.stats.forEach(function(s){ html += '<div class="stat '+(s.color||'')+'"><div class="slbl">'+s.label+'</div><div class="sval">'+s.value+'</div></div>'; });
    html += '</div>';
  }
  if(p.table && p.table.columns && p.table.rows && p.table.rows.length > 0) {
    html += '<div class="tbl"><div class="thd">'+p.table.columns.map(function(c){ return '<span>'+c+'</span>'; }).join('')+'</div>'+p.table.rows.map(function(r){ return '<div class="trow">'+r.map(function(c){ return '<span>'+c+'</span>'; }).join('')+'</div>'; }).join('')+'</div>';
  }
  if(p.actions && p.actions.length > 0) {
    html += '<div class="acts">'+p.actions.map(function(a,i){ return '<button class="'+(i===0?'bp':'bo')+'">'+a+'</button>'; }).join('')+'</div>';
  }
  return html || '<div style="font-size:14px;color:#374151">Done!</div>';
}

// ---- Send to Claude ----
function send(text) {
  if(busy || !text || !text.trim()) return;
  busy = true;
  document.getElementById('sendbtn').disabled = true;
  document.getElementById('inp').value = '';
  addUser(text);
  chatHistory.push({role:'user', content:text});
  showTyping();

  fetch('/api/chat', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({messages: chatHistory})
  }).then(function(r){ return r.json(); }).then(function(result) {
    if(result.error) { hideTyping(); addBot('<div style="color:#DC2626">Error: '+(result.error.message||'Unknown error')+'</div>'); busy=false; document.getElementById('sendbtn').disabled=false; return; }
    var raw = (result.content&&result.content[0]&&result.content[0].text)||'{}';
    chatHistory.push({role:'assistant', content:raw});
    var parsed;
    try { parsed = JSON.parse(raw); } catch(e) { parsed = {message:raw}; }
    hideTyping();
    addBot(render(parsed));
    if(parsed.message) speakMessage(parsed.message);
    busy=false; document.getElementById('sendbtn').disabled=false;
  }).catch(function(e) {
    hideTyping(); addBot('<div style="color:#DC2626">Error: '+e.message+'</div>');
    busy=false; document.getElementById('sendbtn').disabled=false;
  });
}

// ---- Voice Modal ----
function setVoiceState(state) {
  voiceModal.className = state ? 'active '+state : 'active';
  var status = document.getElementById('voice-status');
  var sub = document.getElementById('voice-sub');
  if(state === 'listening') { status.textContent = 'Listening...'; sub.textContent = 'Speak in Hindi or English'; }
  if(state === 'processing') { status.textContent = 'Processing...'; sub.textContent = 'Please wait'; }
}

function openVoiceModal() {
  if(busy) return;
  voiceModal.classList.add('active');

  // User click unlocks audio before asynchronous Sarvam request.
  unlockAudio();

  var started = false;
  function beginRecording() {
    if(started) return;
    started = true;
    startVoiceRecording();
  }

  fetch('/api/tts', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:'How can I help you today?'})
  }).then(function(r){
    return r.json().then(function(d){
      if(!r.ok) throw new Error(sarvamError(d, r.status));
      return d;
    });
  }).then(function(d){
    return playSarvamAudio(d.audio);
  }).then(beginRecording)
    .catch(function(err){
      console.error('[Sarvam greeting]', err);
      var voiceErr = document.getElementById('voice-error');
      if(voiceErr) { voiceErr.textContent = 'Sarvam greeting unavailable: ' + err.message; voiceErr.style.display = 'block'; }
      beginRecording();
    });

  setTimeout(beginRecording, 5000);
}


function closeVoiceModal() {
  voiceModal.className = '';
  if(mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if(silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
}

function stopAndProcess() {
  if(mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

function startVoiceRecording() {
  setVoiceState('listening');
  audioChunks = [];

  // Try different mimeTypes for browser compatibility
  var mimeType = 'audio/webm';
  if(!MediaRecorder.isTypeSupported('audio/webm')) {
    if(MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
    else mimeType = '';
  }

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream) {
    var options = mimeType ? {mimeType: mimeType} : {};
    mediaRecorder = new MediaRecorder(stream, options);

    // Real audio waveform via AudioContext
    try {
      var audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(stream);
      var analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      var dataArray = new Uint8Array(analyser.frequencyBinCount);
      var bars = document.querySelectorAll('.bar');
      var silenceStart = null;
      var hasSpeech = false;

      function tick() {
        if(!voiceModal.classList.contains('active')) return;
        analyser.getByteFrequencyData(dataArray);
        // Update bars
        var step = Math.floor(dataArray.length / bars.length);
        bars.forEach(function(bar, i) {
          var val = dataArray[i * step] || 0;
          bar.style.height = Math.max(4, Math.min(32, (val/255)*32)) + 'px';
        });
        // Silence detection
        var sum = 0;
        for(var i=0; i<dataArray.length; i++) sum += dataArray[i];
        var avg = sum / dataArray.length;
        if(avg > 8) { hasSpeech = true; silenceStart = null; }
        else if(hasSpeech) {
          if(!silenceStart) silenceStart = Date.now();
          if(Date.now() - silenceStart > 2000) { stopAndProcess(); return; }
        }
        setTimeout(tick, 100);
      }
      tick();
    } catch(e) { console.log('AudioContext error:', e); }

    mediaRecorder.ondataavailable = function(e) { if(e.data && e.data.size > 0) audioChunks.push(e.data); };
    
    mediaRecorder.onstop = function() {
      stream.getTracks().forEach(function(t){ t.stop(); });
      if(!voiceModal.classList.contains('active')) return;
      setVoiceState('processing');
      document.getElementById('voice-status').textContent = 'Transcribing...';
      
      var blob = new Blob(audioChunks, {type: mimeType || 'audio/webm'});
      console.log('Audio blob size:', blob.size, 'type:', blob.type);
      
      var reader = new FileReader();
      reader.onloadend = function() {
        var base64 = reader.result.split(',')[1];
        fetch('/api/stt', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({audio: base64, language:'hi-IN', mimeType: mimeType||'audio/webm'})
        }).then(function(r){ return r.json(); }).then(function(data) {
          console.log('STT response:', data);
          closeVoiceModal();
          if(data.transcript && data.transcript.trim()) {
            send(data.transcript.trim());
          } else if(data.error) {
            addBot('<div style="color:#DC2626;font-size:13px">STT Error: '+data.error+'</div>');
          } else {
            addBot('<div style="color:#9CA3AF;font-size:13px">Could not hear clearly. Please try again.</div>');
          }
        }).catch(function(e) {
          console.error('STT fetch error:', e);
          closeVoiceModal();
          addBot('<div style="color:#DC2626;font-size:13px">Voice error: '+e.message+'</div>');
        });
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start(250); // collect chunks every 250ms
    console.log('Recording started, mimeType:', mediaRecorder.mimeType);

  }).catch(function(e) {
    closeVoiceModal();
    console.error('Mic error:', e);
    alert('Microphone access denied or unavailable: '+e.message);
  });
}

// Event listeners
document.getElementById('micbtn').onclick = function(){ unlockAudio(); openVoiceModal(); };
document.getElementById('voice-stop').onclick = stopAndProcess;
document.getElementById('voice-backdrop').onclick = closeVoiceModal;
document.getElementById('voice-cancel').onclick = closeVoiceModal;
document.getElementById('voice-type-link').onclick = function() { closeVoiceModal(); document.getElementById('inp').focus(); };
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeVoiceModal(); });
document.getElementById('sendbtn').onclick = function(){ send(document.getElementById('inp').value.trim()); };
document.getElementById('inp').onkeydown = function(e){ if(e.key==='Enter') send(document.getElementById('inp').value.trim()); };

// Init
window.onload = function() {
  addBot('<div style="font-size:14px;line-height:1.7;color:#374151">Good morning! \uD83D\uDC4B I\'m your AI assistant for <b>TradeEzee</b>.<br>Type your question or click the <b>mic button</b> to speak in Hindi or English.</div>');
  var sugs = ["Show me today's sales summary","Which parties have outstanding payments?","Top selling products this month","Create invoice for Hira Pharma Distributors","Products expiring in next 60 days","Show purchases from stockists"];
  var el = document.getElementById('suggestions');
  sugs.forEach(function(s){
    var b = document.createElement('button');
    b.className='chip'; b.textContent=s;
    b.onclick=function(){ send(s); };
    el.appendChild(b);
  });
};
</script>
